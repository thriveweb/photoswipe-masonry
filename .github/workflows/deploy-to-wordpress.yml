# Deploy plugin to WordPress.org via SVN when a release/tag is published
# - This action runs on release published or on push of a tag
# - Ensure readme.txt Stable tag and plugin header Version match the tag name
# - Requires secrets: SVN_USERNAME, SVN_PASSWORD
name: Deploy to WordPress.org

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Optional: Build / prepare step if you need to compile assets, e.g. npm run build
      # - name: Install Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 18
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build
      #   run: npm run build

      # Deploy to WordPress.org via SVN
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@v1
        with:
          svn-url: https://plugins.svn.wordpress.org/photoswipe-masonry
          svn-username: ${{ secrets.SVN_USERNAME }}
          svn-password: ${{ secrets.SVN_PASSWORD }}
          assets-dir: assets
          commit-message: Deploy release ${{ github.ref_name }}

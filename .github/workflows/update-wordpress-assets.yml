# Publish authorised directory artwork and captions without changing the plugin version.
name: Update WordPress.org images

on:
  push:
    branches:
      - master
    paths:
      - ".wordpress-org/**"
      - "readme.txt"
      - ".github/workflows/update-wordpress-assets.yml"

permissions:
  contents: read

jobs:
  assets:
    # Full releases publish the readme and assets together in the release workflow.
    if: "!startsWith(github.event.head_commit.message, 'Release ')"
    name: Publish gallery artwork
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
      - name: Update WordPress.org artwork and captions
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SLUG: photoswipe-masonry
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: "true"
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
